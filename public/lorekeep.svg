<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="tile" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#2e1f1b"/>
      <stop offset="1" stop-color="#140e0d"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4645a"/>
      <stop offset="1" stop-color="#9a3a35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7cf7a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f7cf7a" stop-opacity="0"/>
    </radialGradient>
    <!-- the cover: a book whose top edge is a row of battlements -->
    <path id="keep" d="M260 236q0-16 16-16h32q16 0 16 16v48h40v-48q0-16 16-16h32q16 0 16 16v48h40v-48q0-16 16-16h32q16 0 16 16v48h40v-48q0-16 16-16h32q16 0 16 16v48h40v-48q0-16 16-16h32q16 0 16 16V776q0 24-24 24H284q-24 0-24-24Z"/>
    <clipPath id="cover-clip"><use href="#keep"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="225" fill="url(#tile)"/>
  <!-- page block showing on the right and bottom -->
  <path d="M310 330h432q24 0 24 24v444q0 24-24 24H334q-24 0-24-24Z" fill="#f3e7d6"/>
  <g stroke="#c9b8a4" stroke-width="5" opacity="0.8">
    <path d="M753 360v430"/>
    <path d="M344 811h386"/>
  </g>
  <use href="#keep" fill="url(#cover)"/>
  <g clip-path="url(#cover-clip)">
    <!-- gold spine below the battlements, and two tooled bands -->
    <rect x="260" y="284" width="52" height="540" fill="#e9b85c"/>
    <rect x="312" y="284" width="10" height="540" fill="#140e0d" opacity="0.25"/>
    <rect x="322" y="336" width="418" height="10" fill="#e9b85c" opacity="0.9"/>
    <rect x="322" y="742" width="418" height="10" fill="#e9b85c" opacity="0.9"/>
  </g>
  <!-- the keyhole, lit from inside -->
  <circle cx="531" cy="540" r="160" fill="url(#glow)"/>
  <path d="M531 446a52 52 0 0 1 30 94.5L578 650H484l17-109.5A52 52 0 0 1 531 446Z" fill="#f7cf7a"/>
</svg>
