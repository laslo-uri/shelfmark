<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Shelfmark — your personal bookshelf, scanned from real life." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shelfmark" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="Shelfmark · Personal Bookshelf" />
    <meta property="og:description" content="Your personal bookshelf, scanned from real life." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shelfmark · Personal Bookshelf" />
    <meta name="twitter:description" content="Your personal bookshelf, scanned from real life." />
    <meta name="twitter:image" content="/pwa-512.png" />
    <script>
      (function () {
        var stored = "dark";
        try {
          var value = localStorage.getItem("shelfmark-theme");
          if (value === "dark" || value === "light" || value === "system") stored = value;
        } catch (e) {}
        var theme = stored === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : stored === "light" ? "light" : "dark";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        var color = theme === "light" ? "#f6f1ea" : "#0e0f11";
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", color);
        var schemeMeta = document.querySelector('meta[name="color-scheme"]');
        if (schemeMeta) schemeMeta.setAttribute("content", theme);
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/boot.css" />
    <title>Shelfmark · Personal Bookshelf</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
  </head>
  <body>
    <a href="#bookshelf-main" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
